<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>Contact Manager</h1>
    <span id="total1">Total: 0</span>
  </div>

  <div class="menu">
    <div class="tab active" onclick="showPage('page1', this)">List</div>
    <div class="tab" onclick="showPage('page2', this)">Add Contact</div>
    <div class="tab" onclick="showPage('page3', this)">Search</div>
    <div class="tab" onclick="showPage('page4', this)">Report</div>
  </div>

  <div class="wrap">

    <!-- PAGE 1: LIST -->
    <div id="page1" class="page active">

      <div class="filters">
        <button class="fbtn active" onclick="filterList('All', this)">All</button>
        <button class="fbtn" onclick="filterList('Family', this)">Family</button>
        <button class="fbtn" onclick="filterList('Work', this)">Work</button>
        <button class="fbtn" onclick="filterList('Customers', this)">Customers</button>
        <button class="fbtn" onclick="filterList('Friends', this)">Friends</button>
      </div>

      <div class="tools">
        <span>Quick Actions:</span>
        <button class="clearbtn" onclick="clearAll()">Delete All Contacts</button>
      </div>

      <div id="list1"></div>
    </div>

    <!-- PAGE 2: ADD / EDIT FORM -->
    <div id="page2" class="page">
      <div class="box">
        <h3 id="title1">Add New Contact</h3>
        <form id="form1">
          <input type="hidden" id="id1">

          <label>Full Name:</label>
          <input type="text" id="name1" required>

          <label>Phone Number:</label>
          <input type="tel" id="phone1" required>

          <label>Email:</label>
          <input type="email" id="email1" required>

          <label>Company / Job:</label>
          <input type="text" id="company1">

          <label>Address:</label>
          <input type="text" id="address1">

          <label>Category:</label>
          <select id="cat1">
            <option value="Family">Family</option>
            <option value="Work">Work</option>
            <option value="Customers">Customers</option>
            <option value="Friends">Friends</option>
          </select>

          <button type="submit" class="savebtn">Save</button>
        </form>
      </div>
    </div>

    <!-- PAGE 3: SEARCH -->
    <div id="page3" class="page">
      <div class="box">
        <h3>Search Contacts</h3>
        <input type="text" id="search1" placeholder="Type a name, phone, or email...">
      </div>
      <div id="list2"></div>
    </div>

    <!-- PAGE 4: REPORT -->
    <div id="page4" class="page">
      <div class="box">
        <h3>Report</h3>
        <p>Here is a summary of your saved contacts:</p>

        <div class="grid">
          <div class="box2">
            <h4>Total Contacts</h4>
            <p id="r1">0</p>
          </div>
          <div class="box2">
            <h4>Family</h4>
            <p id="r2">0</p>
          </div>
          <div class="box2">
            <h4>Work</h4>
            <p id="r3">0</p>
          </div>
          <div class="box2">
            <h4>Customers</h4>
            <p id="r4">0</p>
          </div>
          <div class="box2">
            <h4>Friends</h4>
            <p id="r5">0</p>
          </div>
        </div>
      </div>
    </div>

  </div>
  <script src="scripts.js"></script>

</body>
</html>
